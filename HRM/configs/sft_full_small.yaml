## Full fine-tune of HRM-Text-1B on a budget-limited, balanced data mix.
## Single 24 GB GPU (RTX 4090), ~4-5 days.
##
## Prepare the data first (mini comes in near-full, the rest cap at 33k ->
## ~195k samples after drop_longer):
##   uv run --project HRM python HRM/prepare_data.py \
##       --in_dir data/grids_v15 --out_dir data/hrm_v1_small --max_per_subset 33000
##
## Then:
##   uv run --project HRM python HRM/train_sft.py \
##       --config HRM/configs/sft_full_small.yaml

model:
  name_or_path: models/HRM-Text-1B-arc
  dtype: bfloat16
  trust_remote_code: true
  attn_implementation: flex_attention
  gradient_checkpointing: true

  lora:
    enabled: false

data:
  train_dataset_path:
    - data/hrm_v1_small/arc2_training
    - data/hrm_v1_small/mini
    - data/hrm_v1_small/concept
    - data/hrm_v1_small/rearc
    - data/hrm_v1_small/nvarc_training
    - data/hrm_v1_small/nvarc_full
  val_dataset_path: data/hrm_v1_small/arc2_evaluation6
  max_length: 8192
  drop_longer: true

training:
  output_dir: checkpoints/hrm-arc-full-small
  seed: 42
  num_train_epochs: 2
  max_steps: -1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 32
  learning_rate: 1.0e-5
  min_lr: 1.0e-7
  weight_decay: 0.1
  warmup_steps: 400
  lr_scheduler_type: cosine
  max_grad_norm: 0.5
  logging_steps: 20
  eval_steps: 500
  save_steps: 250
  save_total_limit: 4
  bf16: true
  optim: adamw_bnb_8bit
  report_to: wandb
  run_name: hrm-arc-sft-full-small
