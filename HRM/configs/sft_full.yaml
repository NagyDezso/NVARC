## Full fine-tune of HRM-Text-1B on the COMPLETE ~3.2M-sample dataset,
## single 24 GB GPU (e.g. RTX 4090).
##
## Resume the batch-256 checkpoint and anneal with cosine:
##   uv run --project HRM python HRM/train_sft.py \
##       --config HRM/configs/sft_full.yaml --resume

model:
  name_or_path: models/HRM-Text-1B-arc
  dtype: bfloat16
  trust_remote_code: true
  attn_implementation: flex_attention
  gradient_checkpointing: true

  lora:
    enabled: false

data:
  train_dataset_path:
    - data/hrm_v1/arc2_training
    - data/hrm_v1/mini
    - data/hrm_v1/concept
    - data/hrm_v1/rearc
    - data/hrm_v1/nvarc_training
    - data/hrm_v1/nvarc_full
  val_dataset_path: data/hrm_v1/arc2_evaluation6
  max_length: 4096
  drop_longer: true

training:
  output_dir: checkpoints/hrm-arc-full
  seed: 42
  num_train_epochs: 1
  max_steps: 2400
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 128
  learning_rate: 5.0e-5
  min_lr: 1.0e-7
  weight_decay: 0.1
  warmup_steps: 200
  lr_scheduler_type: cosine
  max_grad_norm: 0.5
  logging_steps: 5
  eval_steps: 50
  save_steps: 50
  save_total_limit: 5
  bf16: true
  optim: adamw_bnb_8bit
  report_to: wandb
  run_name: hrm-arc-sft-full
