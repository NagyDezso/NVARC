[project]
name = "nvarc-hrm"
version = "0.1.0"
description = "NVARC ARC-AGI-2 pipeline adapted to use sapientinc/HRM-Text-1B"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "transformers>=5.9.0",
    "accelerate>=0.34",
    "peft>=0.13",
    "datasets>=2.20",
    "safetensors>=0.4",
    "numpy",
    "tqdm",
    "omegaconf",
    "kaggle",
    # Experiment tracking; all configs default to report_to: wandb.
    # Use `wandb offline` / WANDB_MODE=offline to run without a cloud account.
    "wandb>=0.17",
    # 4-/8-bit optimizers (optim: adamw_bnb_8bit). No Windows wheels, so the
    # marker skips it there — Windows users must pick a non-bnb optim.
    "bitsandbytes>=0.43; sys_platform != 'win32'",
]

[tool.uv]
# Pin to the same Python the rest of the repo uses (see ../.venv/pyvenv.cfg).
required-version = ">=0.4"
# The yarl 1.24.x series only ships cp310 wheels, breaking cp311/cp312 envs.
# Force a version range that has wheels for all supported ABIs.
override-dependencies = [
    "yarl>=1.18,<1.24",
]
